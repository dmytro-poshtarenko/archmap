[project]
name = "archmap-analysis"
version = "0.1.0"
description = "Statistical analysis of archmap evaluations: bootstrap intervals, hypothesis checks, tables and figures"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "numpy",
  "pandas",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
