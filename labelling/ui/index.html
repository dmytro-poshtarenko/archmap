<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archmap · розмітка еталона</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e7;
    --accent: #2f5bea; --accent-soft: #e8eefe; --hit: #fff4c2; --ok: #1f8a4c; --ok-soft: #e3f4ea; --bad: #c0392b;
    --code-bg: #f6f6f4; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #7c9bff; --accent-soft: #232b45; --hit: #4a3f12; --ok: #4cc584; --ok-soft: #173826; --bad: #ff7a6b;
      --code-bg: #1a1a1d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header .title { font-weight: 600; }
  header .who { color: var(--muted); }
  header nav { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  select, input[type=text], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
  aside .filters { position: sticky; top: 0; background: var(--panel); padding: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
  aside ol { list-style: none; margin: 0; padding: 0; }
  aside li { padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; }
  aside li:hover { background: var(--accent-soft); }
  aside li.current { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  aside li .rank { color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 2; }
  aside li .where { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  aside li .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside li.done .sub { color: var(--ok); }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--code-bg); border: 1px solid var(--line); margin-right: 4px; }
  .badge.double { border-color: var(--accent); color: var(--accent); }
  section#detail { overflow: auto; padding: 12px 16px 40px; min-width: 0; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
  .meta .path { font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .meta .muted { color: var(--muted); font-size: 12px; }
  .code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font: 12.5px/1.5 var(--mono); max-height: 52vh; overflow: auto; margin: 0 0 12px; }
  .code .ln { display: flex; white-space: pre; }
  .code .ln .n { flex: 0 0 52px; text-align: right; padding-right: 10px; color: var(--muted); user-select: none; cursor: default; }
  .code .ln .t { padding-right: 16px; }
  .code .ln.hit { background: var(--hit); }
  .code .ln.site { background: var(--ok-soft); }
  .code .ln.span { background: var(--accent-soft); }
  .code .ln.cand .n::before { content: "●"; color: var(--accent); margin-right: 4px; font-size: 9px; vertical-align: middle; }
  .code.pick .ln .n { cursor: pointer; }
  .code.pick .ln:hover .n { color: var(--accent); }
  form { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; align-items: center; max-width: 980px; }
  form label.k { color: var(--muted); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .target-wrap { position: relative; flex: 1; min-width: 280px; }
  .target-wrap input { width: 100%; font-family: var(--mono); }
  .suggest { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-height: 300px; overflow: auto; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .suggest div { padding: 4px 8px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
  .suggest div small { color: var(--muted); font-family: system-ui, sans-serif; margin-left: 6px; }
  .suggest div.sel, .suggest div:hover { background: var(--accent-soft); }
  .case button { min-width: 34px; }
  .hint { color: var(--muted); font-size: 12px; }
  .warn { color: var(--bad); font-size: 12px; }
  .error { color: var(--bad); white-space: pre-wrap; grid-column: 1 / -1; }
  .saved { color: var(--ok); grid-column: 1 / -1; }
  textarea { width: 100%; min-height: 44px; resize: vertical; }
  .hidden { display: none !important; }
  .keys { color: var(--muted); font-size: 12px; margin-top: 18px; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
  #guide { position: fixed; inset: 0 0 0 auto; width: min(760px, 92vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 32px rgba(0,0,0,.15); z-index: 10; display: flex; flex-direction: column; }
  #guide header { justify-content: space-between; }
  #guide pre { flex: 1; overflow: auto; margin: 0; padding: 16px 20px; white-space: pre-wrap; font: 13px/1.55 system-ui, sans-serif; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); } form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <span class="title">archmap · розмітка еталона</span>
  <span class="who" id="who"></span>
  <nav>
    <button type="button" class="tab on" data-view="sample">Вибірка</button>
    <button type="button" class="tab" data-view="gap">Перевірка пропусків</button>
    <select id="split" title="Частина"></select>
    <button type="button" id="guideBtn" title="Посібник (g)">Посібник</button>
  </nav>
  <span class="progress" id="progress"></span>
</header>
<main>
  <aside id="aside">
    <div class="filters" id="filters">
      <button type="button" class="on" data-filter="todo">Нерозмічені</button>
      <button type="button" data-filter="all">Усі</button>
    </div>
    <ol id="list"></ol>
  </aside>
  <section id="detail"><div class="empty">Оберіть місце в переліку ліворуч.</div></section>
</main>
<div id="guide" class="hidden">
  <header><span class="title">Посібник із розмітки</span><button type="button" id="guideClose">Закрити (Esc)</button></header>
  <pre id="guideText"></pre>
</div>

<template id="formTpl">
  <form id="form" autocomplete="off">
    <label class="k">Місце виклику</label>
    <div class="row">
      <button type="button" data-site="1">Так <kbd>y</kbd></button>
      <button type="button" data-site="0">Ні <kbd>n</kbd></button>
      <span class="hint" id="rangeHint"></span>
    </div>

    <label class="k notsite">Причина</label>
    <div class="row notsite"><select name="notSiteReason"></select></div>

    <label class="k site">Тип</label>
    <div class="row site" id="types"></div>

    <label class="k site">Ціль</label>
    <div class="row site">
      <div class="target-wrap">
        <input type="text" name="targetKey" placeholder="kind:method:name@component, напр. http:GET:/api/v1/rooms.info@rocketchat" spellcheck="false">
        <div class="suggest hidden" id="suggest"></div>
      </div>
      <button type="button" id="noneBtn" title="Цілі в комплексі немає (0)">NONE <kbd>0</kbd></button>
    </div>
    <label class="k site none"></label>
    <div class="row site none"><select name="noneReason"></select></div>
    <label class="k site keyonly"></label>
    <div class="row site keyonly"><span class="hint" id="catalogHint"></span></div>

    <label class="k site keyonly">Випадок</label>
    <div class="row site keyonly case" id="cases"></div>

    <label class="k">Примітка</label>
    <div><textarea name="note" placeholder="необов'язково"></textarea></div>

    <span></span>
    <div class="row">
      <button type="submit" class="primary">Зберегти й далі <kbd>Enter</kbd></button>
      <button type="button" id="prevBtn">← <kbd>k</kbd></button>
      <button type="button" id="nextBtn"><kbd>j</kbd> →</button>
      <button type="button" id="fullBtn" title="Весь файл (f)">Весь файл <kbd>f</kbd></button>
    </div>
    <div class="error" id="error"></div>
    <div class="saved" id="saved"></div>
  </form>
</template>

<script>
"use strict";
const TYPES = [["http", "HTTP"], ["ddp", "DDP"], ["broker", "Брокер"], ["db", "БД"], ["trigger", "Тригер"]];
const CASES = {
  1: "Адресу записано безпосередньо в місці виклику",
  2: "Адреса з підстановками, шлях видно повністю",
  3: "Адресу приховано за допоміжною функцією чи обгорткою",
  4: "Адресу або розміщення задано в налаштуваннях",
  5: "Ціль оголошено механізмом, для якого правил немає",
  6: "Однакова ціль у кількох частинах, інфраструктура не розв'язує",
  7: "Ціль визначає правило шлюзу",
  8: "Ціль стає відомою лише під час роботи",
};
const REASONS = {
  "not-a-call": "не виклик (імпорт, коментар, тип, рядок)",
  "declaration": "оголошення обробника, а не виклик",
  "duplicate": "дублює інше місце (багаторядковий виклик)",
  "wrapper-internal": "внутрішній виклик обгортки, адреса приходить параметром",
  "external": "зовнішня система",
  "intra": "у межах однієї розгорнутої частини",
  "client-local": "локальне сховище чи об'єкт клієнта",
  "other": "інше (поясніть у примітці)",
};

const $ = (sel, root = document) => root.querySelector(sel);
const state = { view: "sample", split: "dev", filter: "todo", queue: [], gap: [], current: null, item: null, full: false, picked: null, server: null, paint: null };

async function api(path, init) {
  const res = await fetch(path, init);
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error ?? res.statusText);
  return body;
}

async function init() {
  state.server = await api("/api/state");
  const splits = Object.keys(state.server.splits);
  state.split = splits[0] ?? "dev";
  $("#split").innerHTML = splits.map((s) => `<option value="${s}">${s}</option>`).join("");
  $("#who").textContent = `розмітник ${state.server.annotator}${state.server.role === "second" ? " (другий)" : ""} · посібник ${state.server.guide}`;
  if (state.server.role === "second") $('[data-view="gap"]').classList.add("hidden");
  await reload();
}

async function reload() {
  state.server = await api("/api/state");
  const s = state.server.splits[state.split];
  $("#progress").textContent = s ? `${state.split}: ${s.done} / ${s.total}` : "";
  if (state.view === "sample") {
    state.queue = await api(`/api/queue?split=${state.split}`);
    $("#filters").classList.remove("hidden");
  } else {
    state.gap = (await api("/api/gap")).filter((f) => f.split === state.split);
    $("#filters").classList.add("hidden");
  }
  renderList();
}

function visibleQueue() {
  return state.filter === "todo" ? state.queue.filter((q) => !q.done || q.item === state.current) : state.queue;
}

function renderList() {
  const list = $("#list");
  if (state.view === "sample") {
    const rows = visibleQueue();
    list.innerHTML = rows.length
      ? rows.map((q) => `<li data-item="${esc(q.item)}" class="${q.done ? "done" : ""} ${q.item === state.current ? "current" : ""}">
          <span class="rank">${q.rank}</span>
          <span class="where" title="${esc(q.item)}">${esc(q.path)}:${q.line}</span>
          <span class="sub"><span class="badge">${q.stratum}</span>${q.double ? '<span class="badge double">×2</span>' : ""}${q.summary ? esc(q.summary) : esc(q.component ?? "без компонента")}</span>
        </li>`).join("")
      : `<li class="empty">Усе розмічено 🎉</li>`;
  } else {
    list.innerHTML = state.gap.length
      ? state.gap.map((f) => `<li data-gap="${esc(f.repo)}:${esc(f.path)}" class="${f.reviewed ? "done" : ""} ${state.current === `${f.repo}:${f.path}` ? "current" : ""}">
          <span class="rank">${f.rank}</span>
          <span class="where" title="${esc(f.path)}">${esc(f.path)}</span>
          <span class="sub">${f.reviewed ? "прочитано" : "не прочитано"} · місць: ${f.sites.length}</span>
        </li>`).join("")
      : `<li class="empty">Файлів для перевірки в цій частині немає</li>`;
  }
}

async function openItem(id) {
  state.current = id;
  state.full = false;
  state.item = await api(`/api/item?split=${state.split}&item=${encodeURIComponent(id)}`);
  renderList();
  renderItem();
}

function codeHtml(from, lines, hitLine, siteLines = new Set(), candLines = new Set(), endLine = null) {
  return lines.map((t, i) => {
    const n = from + i;
    const cls = [n === hitLine ? "hit" : siteLines.has(n) ? "site" : "", endLine && n > hitLine && n <= endLine ? "span" : "", candLines.has(n) ? "cand" : ""].join(" ");
    return `<div class="ln ${cls}" data-n="${n}"><span class="n">${n}</span><span class="t">${esc(t) || " "}</span></div>`;
  }).join("");
}

/** Shift-click on a line number after the site's first line marks where a multi-line call ends. */
function wireRange(onEnd) {
  $("#code").addEventListener("click", (e) => {
    const ln = e.target.closest(".ln");
    if (!ln || !e.target.classList.contains("n") || !e.shiftKey) return;
    e.stopPropagation();
    onEnd(Number(ln.dataset.n));
  }, true);
}

function renderItem() {
  const it = state.item;
  const detail = $("#detail");
  detail.innerHTML = `
    <div class="meta">
      <span class="path">${esc(it.repo)}:${esc(it.path)}:${it.line}</span>
      <span class="badge">${esc(it.stratum ?? "сайт із перевірки пропусків")}</span>
      <span class="muted">компонент: ${esc(it.component ?? "—")}</span>
      <span class="muted">шаблони: ${esc((it.patterns ?? []).join(", ") || "—")}</span>
    </div>
    <div class="code" id="code"></div>
    <p class="hint">● — інші рядки-кандидати поруч. Якщо виклик займає кілька рядків, Shift+клік на номері його останнього рядка.</p>`;
  detail.appendChild($("#formTpl").content.cloneNode(true));
  const where = { origin: it.stratum ? "sample" : "gap", repo: it.repo, path: it.path, line: it.line, item: it.item, endLine: it.label?.endLine ?? null };
  const paint = () => { $("#code").innerHTML = codeHtml(it.code.from, it.code.lines, it.line, new Set(), new Set(it.candidateLines), where.endLine); };
  state.paint = paint;
  paint();
  wireRange((n) => { where.endLine = n > it.line ? n : null; paint(); showRange(where); });
  wireForm(it.label, it.stratum, where);
  showRange(where);
  requestAnimationFrame(() => $(".ln.hit")?.scrollIntoView({ block: "center" }));
}

async function openGapFile(key) {
  state.current = key;
  const [repo, ...rest] = key.split(":");
  const path = rest.join(":");
  const f = await api(`/api/file?repo=${encodeURIComponent(repo)}&path=${encodeURIComponent(path)}`);
  const info = state.gap.find((g) => `${g.repo}:${g.path}` === key);
  const sites = new Set((info?.sites ?? []).map((s) => s.line));
  renderList();
  $("#detail").innerHTML = `
    <div class="meta">
      <span class="path">${esc(repo)}:${esc(path)}</span>
      <span class="muted">компонент: ${esc(f.component ?? "—")}</span>
      <button type="button" id="gapDone" class="${info?.reviewed ? "on" : ""}">${info?.reviewed ? "Прочитано повністю ✓" : "Позначити прочитаним повністю"}</button>
    </div>
    <p class="hint">Прочитайте файл від початку до кінця. Клацніть номер рядка, щоб розмітити місце виклику; зелені рядки вже розмічено.</p>
    <div class="code pick" id="code" style="max-height:60vh">${codeHtml(1, f.lines, -1, sites)}</div>
    <div id="gapForm"></div>`;
  $("#code").addEventListener("click", (e) => {
    const ln = e.target.closest(".ln");
    if (ln && e.target.classList.contains("n")) pickGapLine(repo, path, Number(ln.dataset.n), e.shiftKey);
  });
  $("#gapDone").addEventListener("click", async () => {
    await api("/api/gap/done", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ repo, path }) });
    await reload();
    await openGapFile(key);
  });
}

async function pickGapLine(repo, path, line, shift) {
  if (shift && state.picked && state.picked.repo === repo && state.picked.path === path) {
    state.picked.endLine = line > state.picked.line ? line : null;
    markGapRange();
    showRange(state.picked);
    return;
  }
  const id = `${repo}:${path}:${line}`;
  const it = await api(`/api/item?split=${state.split}&item=${encodeURIComponent(id)}&blind=1`);
  state.picked = { origin: "gap", repo, path, line, item: id, endLine: it.label?.endLine ?? null };
  markGapRange();
  const holder = $("#gapForm");
  holder.innerHTML = `<div class="meta"><span class="path" id="gapRange"></span><span class="hint">Shift+клік — останній рядок багаторядкового виклику</span></div>`;
  holder.appendChild($("#formTpl").content.cloneNode(true));
  $("#prevBtn", holder).classList.add("hidden");
  $("#nextBtn", holder).classList.add("hidden");
  $("#fullBtn", holder).classList.add("hidden");
  showRange(state.picked);
  wireForm(it.label, null, state.picked, async () => {
    await reload();
    await openGapFile(`${repo}:${path}`);
  });
  holder.scrollIntoView({ block: "nearest" });
}

function markGapRange() {
  const p = state.picked;
  document.querySelectorAll("#code .ln").forEach((el) => {
    const n = Number(el.dataset.n);
    el.classList.toggle("hit", n === p.line);
    el.classList.toggle("span", Boolean(p.endLine) && n > p.line && n <= p.endLine);
  });
}

function showRange(where) {
  const text = where.endLine ? `рядки ${where.line}–${where.endLine}` : `рядок ${where.line}`;
  const el = $("#gapRange") ?? $("#rangeHint");
  if (el) el.textContent = text;
}

function wireForm(label, stratum, where, afterSave) {
  const form = $("#form");
  const tk = $('input[name="targetKey"]', form);
  const noteEl = $('textarea[name="note"]', form);
  const notSiteEl = $('select[name="notSiteReason"]', form);
  const noneEl = $('select[name="noneReason"]', form);
  const f = {
    isSite: label ? label.isSite : null,
    type: label?.type ?? stratum ?? null,
    target: label?.target ?? "",
    caseNo: label?.caseNo ?? null,
    reason: label?.reason ?? null,
    note: label?.note ?? "",
  };
  notSiteEl.innerHTML = state.server.reasons.notSite.map((r) => `<option value="${r}">${REASONS[r] ?? r}</option>`).join("");
  noneEl.innerHTML = state.server.reasons.none.map((r) => `<option value="${r}">${REASONS[r] ?? r}</option>`).join("");
  $("#types", form).innerHTML = TYPES.map(([v, t]) => `<button type="button" data-type="${v}">${t}</button>`).join("");
  $("#cases", form).innerHTML = Object.entries(CASES).map(([n, t]) => `<button type="button" data-case="${n}" title="${esc(t)}">${n}</button>`).join("") +
    `<span class="hint" id="caseHint"></span>`;
  tk.value = f.target;
  noteEl.value = f.note;
  if (f.reason) (f.isSite ? noneEl : notSiteEl).value = f.reason;

  const sync = () => {
    form.querySelectorAll("[data-site]").forEach((b) => b.classList.toggle("on", f.isSite === (b.dataset.site === "1")));
    form.querySelectorAll("[data-type]").forEach((b) => b.classList.toggle("on", f.type === b.dataset.type));
    form.querySelectorAll("[data-case]").forEach((b) => b.classList.toggle("on", f.caseNo === Number(b.dataset.case)));
    const none = tk.value.trim() === "NONE";
    $("#noneBtn", form).classList.toggle("on", none);
    form.querySelectorAll(".site").forEach((el) => el.classList.toggle("hidden", f.isSite !== true));
    form.querySelectorAll(".notsite").forEach((el) => el.classList.toggle("hidden", f.isSite !== false));
    form.querySelectorAll(".none").forEach((el) => el.classList.toggle("hidden", f.isSite !== true || !none));
    form.querySelectorAll(".keyonly").forEach((el) => el.classList.toggle("hidden", f.isSite !== true || none));
    $("#caseHint", form).textContent = f.caseNo ? CASES[f.caseNo] : "";
  };
  form.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    // Only a real mouse click moves focus to the target: after a keyboard shortcut the
    // next keys (0, 1-8) must keep working as shortcuts.
    if (b.dataset.site !== undefined) { f.isSite = b.dataset.site === "1"; sync(); if (f.isSite && e.detail > 0) tk.focus(); }
    if (b.dataset.type) { f.type = b.dataset.type; sync(); }
    if (b.dataset.case) { f.caseNo = Number(b.dataset.case); sync(); }
    if (b.id === "noneBtn") { tk.value = tk.value.trim() === "NONE" ? "" : "NONE"; f.caseNo = null; sync(); checkKnown(); }
    if (b.id === "prevBtn") move(-1);
    if (b.id === "nextBtn") move(1);
    if (b.id === "fullBtn") toggleFull();
  });

  const suggest = $("#suggest", form);
  let options = [];
  let sel = -1;
  let timer;
  const renderSuggest = () => {
    suggest.innerHTML = options.map((o, i) => `<div class="${i === sel ? "sel" : ""}" data-i="${i}">${esc(o.key)}<small>${esc(o.note ?? "")}${o.origin === "manual" ? " · додано вручну" : ""}</small></div>`).join("");
    suggest.classList.toggle("hidden", options.length === 0);
  };
  const choose = (i) => { tk.value = options[i].key; options = []; renderSuggest(); sync(); checkKnown(); };
  tk.addEventListener("input", () => {
    clearTimeout(timer);
    sync();
    timer = setTimeout(async () => {
      const q = tk.value.trim();
      options = q.length < 2 || q === "NONE" ? [] : await api(`/api/catalog?q=${encodeURIComponent(q)}`);
      sel = options.length ? 0 : -1;
      renderSuggest();
      checkKnown();
    }, 120);
  });
  tk.addEventListener("keydown", (e) => {
    if (suggest.classList.contains("hidden")) return;
    if (e.key === "ArrowDown") { sel = Math.min(options.length - 1, sel + 1); renderSuggest(); e.preventDefault(); }
    if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); renderSuggest(); e.preventDefault(); }
    if (e.key === "Enter" && sel >= 0) { choose(sel); e.preventDefault(); e.stopPropagation(); }
    if (e.key === "Escape") { options = []; renderSuggest(); e.stopPropagation(); }
  });
  suggest.addEventListener("mousedown", (e) => { const d = e.target.closest("[data-i]"); if (d) { e.preventDefault(); choose(Number(d.dataset.i)); } });
  tk.addEventListener("blur", () => setTimeout(() => { options = []; renderSuggest(); }, 150));

  const checkKnown = async () => {
    const key = tk.value.trim();
    const hint = $("#catalogHint", form);
    if (!key || key === "NONE") { hint.textContent = ""; return; }
    const found = await api(`/api/catalog?q=${encodeURIComponent(key)}`);
    if (found.some((o) => o.key === key)) { hint.textContent = "є в каталозі"; return; }
    hint.innerHTML = `<span class="warn">Ключа немає в каталозі.</span> <button type="button" id="addKey">Додати в каталог</button>`;
    $("#addKey", form).addEventListener("click", async () => {
      try { await api("/api/catalog", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key }) }); checkKnown(); }
      catch (err) { $("#error", form).textContent = err.message; }
    });
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    $("#error", form).textContent = "";
    const target = tk.value.trim();
    const none = target === "NONE";
    const body = {
      item: where.item, repo: where.repo, path: where.path, line: where.line, endLine: where.endLine ?? null, origin: where.origin,
      isSite: f.isSite === true,
      type: f.isSite ? f.type : null,
      target: f.isSite ? (target || null) : null,
      caseNo: f.isSite && !none ? f.caseNo : null,
      reason: f.isSite === false ? notSiteEl.value : none ? noneEl.value : null,
      note: noteEl.value.trim() || null,
    };
    if (f.isSite === null) { $("#error", form).textContent = "Вкажіть, чи це місце виклику (y / n)."; return; }
    try {
      await api(`/api/label?split=${state.split}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
      $("#saved", form).textContent = "Збережено.";
      if (afterSave) return afterSave();
      const q = state.queue.find((x) => x.item === where.item);
      if (q) q.done = true;
      await reload();
      move(1, true);
    } catch (err) {
      $("#error", form).textContent = err.message;
    }
  });
  sync();
  if (f.target && f.target !== "NONE") checkKnown();
}

function move(step, afterSave = false) {
  const rows = state.filter === "todo" && afterSave ? state.queue.filter((q) => !q.done) : visibleQueue();
  if (rows.length === 0) return renderList();
  const at = rows.findIndex((q) => q.item === state.current);
  const next = afterSave && at === -1 ? rows[0] : rows[Math.min(rows.length - 1, Math.max(0, at + step))];
  if (next) openItem(next.item);
}

async function toggleFull() {
  if (!state.item) return;
  state.full = !state.full;
  const it = await api(`/api/item?split=${state.split}&item=${encodeURIComponent(state.current)}${state.full ? "&full=1" : ""}`);
  state.item.code = it.code;
  state.item.candidateLines = it.candidateLines;
  state.paint?.();
  $(".ln.hit")?.scrollIntoView({ block: "center" });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

$("#list").addEventListener("click", (e) => {
  const li = e.target.closest("li");
  if (li?.dataset.item) openItem(li.dataset.item);
  if (li?.dataset.gap) openGapFile(li.dataset.gap);
});
$("#filters").addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]");
  if (!b) return;
  state.filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach((x) => x.classList.toggle("on", x === b));
  renderList();
});
document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", async () => {
  state.view = t.dataset.view;
  state.current = null;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
  $("#detail").innerHTML = `<div class="empty">${state.view === "gap" ? "Оберіть файл для повного прочитання." : "Оберіть місце в переліку ліворуч."}</div>`;
  await reload();
}));
$("#split").addEventListener("change", async (e) => { state.split = e.target.value; state.current = null; await reload(); });
$("#guideBtn").addEventListener("click", toggleGuide);
$("#guideClose").addEventListener("click", toggleGuide);

async function toggleGuide() {
  const g = $("#guide");
  if (g.classList.contains("hidden") && !$("#guideText").textContent) $("#guideText").textContent = await api("/guide");
  g.classList.toggle("hidden");
}

document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
  if (e.key === "Escape") { if (!$("#guide").classList.contains("hidden")) toggleGuide(); else document.activeElement?.blur(); return; }
  if (typing) {
    if (e.key === "Enter" && document.activeElement?.tagName === "INPUT" && !e.defaultPrevented) { e.preventDefault(); $("#form")?.requestSubmit(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const form = $("#form");
  const click = (sel) => form && $(sel, form)?.click();
  if (e.key === "j") move(1);
  else if (e.key === "k") move(-1);
  else if (e.key === "y") click('[data-site="1"]');
  else if (e.key === "n") click('[data-site="0"]');
  else if (e.key === "0") click("#noneBtn");
  else if (/^[1-8]$/.test(e.key)) click(`[data-case="${e.key}"]`);
  else if (e.key === "/") form && $('input[name="targetKey"]', form)?.focus();
  else if (e.key === "f") toggleFull();
  else if (e.key === "g") toggleGuide();
  else if (e.key === "Enter" && form) form.requestSubmit();
  else return;
  // A handled shortcut never types its character into whatever gets focus next.
  e.preventDefault();
});

init().catch((err) => { $("#detail").innerHTML = `<div class="empty">${esc(err.message)}</div>`; });
</script>
</body>
</html>
