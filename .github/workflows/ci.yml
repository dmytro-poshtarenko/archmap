name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Fetches the pinned Rocket.Chat snapshot (never the held-out repository) and
  # fails if the tool repository repeats code that may not be published.
  licence:
    runs-on: ubuntu-latest
    env:
      ARCHMAP_DATA: ${{ runner.temp }}/data
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/data/fingerprints
          key: fingerprints-${{ hashFiles('configs/rocketchat.yaml', 'configs/rocketchat.lock.json', 'src/workspace/licenceCheck.ts') }}
      - run: pnpm archmap fetch --repo main helm
      - run: pnpm archmap licence-check
