upstream api_backend {
  server api:3000;
}

server {
  listen 80;
  server_name shop.example;

  # health check of the API, exact
  location = /health {
    proxy_pass http://api:3000/healthz;
  }

  location ^~ /static/ {
    proxy_pass http://cdn:8080;
  }

  location ~* \.php$ {
    proxy_pass http://legacy:9000;
  }

  location /api/ {
    proxy_pass http://api_backend/;
  }

  location / {
    proxy_pass http://web:80;
  }
}
